version: '3.1'
services:
    frontend:
        image: 'fvrb/orlabosi:frontendv2'
        ports:
        - "80:80"
    backend:
        image: 'fvrb/orlabosi:backendv3'
        ports:
        - "8087:8080"
        
    bazaSpremnik:
        image: 'fvrb/orlabosi:baza'
        container_name: bazaSpremnik
        environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=master
        ports:
        - "5435:5432"